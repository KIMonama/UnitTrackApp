<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Get Started | UnitTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/frontend/styles/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-light py-4">
      <div class="container justify-content-center">
        <a href="index.html" class="navbar-brand text-primary fw-bold fs-3"
          >UNIT<span class="text-dark">TRACK</span></a
        >
      </div>
    </nav>

    <div class="container py-4 d-flex align-items-center flex-column">
      <div
        class="alert alert-danger d-flex align-items-center d-none mb-4"
        role="alert"
        id="alert"
        style="max-width: 550px; width: 100%"
      >
        
        <i class="bi bi-exclamation-octagon-fill me-2"></i>
        <div id="errorMessage1"></div>
      </div>
      <div
        id="step1"
        class="signup-card p-4 p-md-5 w-100 active"
        style="max-width: 550px"
      >
        <div class="text-center mb-4">
          <span class="step-indicator text-primary fw-bold">Step 1 of 3</span>
          <h2 class="fw-bold mt-2">Admin Details</h2>
          <p class="text-muted">Let's start with your personal info.</p>
        </div>
        <form id="formStep1">
          <div class="row g-3">
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Name"
                  required
                /><label>Full Name</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Email"
                  required
                /><label>Email Address</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  placeholder="Phone"
                  required
                /><label>Phone Number</label>
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-primary w-100 mt-4 rounded-pill py-3"
            >
              Continue <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>

      <div
        id="step2"
        class="signup-card p-4 p-md-5 w-100 d-none"
        style="max-width: 550px"
      >
        <div class="text-center mb-4">
          <span class="step-indicator text-primary fw-bold">Step 2 of 3</span>
          <h2 class="fw-bold mt-2">Property Setup</h2>
          <p class="text-muted">How many properties are we managing today?</p>
        </div>
        <form id="formStep2">
          <div class="mb-4 text-center">
            <label class="form-label small fw-bold text-uppercase d-block mb-3"
              >Number of Properties</label
            >
            <div
              class="input-group input-group-lg shadow-sm mx-auto"
              style="max-width: 250px"
            >
              <button
                class="btn btn-primary px-4"
                type="button"
                onclick="updateStepper(-1)"
              >
                <i class="bi bi-dash-lg"></i>
              </button>

              <input
                type="number"
                id="propCountSelector"
                name="property_count"
                class="form-control text-center fw-bold border-primary"
                value="1"
                min="1"
                max="10"
                readonly
              />

              <button
                class="btn btn-primary px-4"
                type="button"
                onclick="updateStepper(1)"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="form-text mt-2">
              Maximum 10 properties for early access.
            </div>
          </div>

          <div id="dynamicPropsContainer" class="mb-4">
            <div class="property-entry bg-light p-3 rounded-3 mb-2 border">
              <div class="row g-2">
                <div class="col-8">
                  <input
                    type="text"
                    class="form-control prop-name"
                    placeholder="Property Name"
                    required
                  />
                </div>
                <div class="col-4">
                  <input
                    type="number"
                    class="form-control prop-units"
                    placeholder="Units"
                    required
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              onclick="showStep(1)"
              class="btn btn-outline-secondary w-50 rounded-pill"
            >
              Back
            </button>
            <button type="submit" class="btn btn-primary w-50 rounded-pill">
              Next Step
            </button>
          </div>
        </form>
      </div>

      <div
        id="step3"
        class="signup-card p-4 p-md-5 w-100 d-none"
        style="max-width: 550px"
      >
        <div class="text-center mb-4">
          <span class="step-indicator text-primary fw-bold">Step 3 of 3</span>
          <h2 class="fw-bold mt-2">Set Your PIN</h2>
          <p class="text-muted">Choose a 4-digit PIN for your dashboard.</p>
        </div>
        <form id="formStep3">
          <div class="row g-3">
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="password"
                  class="form-control"
                  id="pass"
                  maxlength="4"
                  placeholder="Pin"
                  required
                /><label>4-Digit Pin</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="password"
                  class="form-control"
                  id="confirmPass"
                  maxlength="4"
                  placeholder="Confirm"
                  required
                /><label>Confirm Pin</label>
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-primary w-100 mt-4 rounded-pill py-3"
            >
              Finish Registration <i class="bi bi-check-circle"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/frontend/scripts/main.js"></script>
  </body>
</html>
