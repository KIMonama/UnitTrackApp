<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Dashboard | UnitTrack</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-white" onload="populateTable()">
    <!-- Navbar -->
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center py-4 border-bottom border-primary">
      <h1>Welcome, Owner 👋</h1>
      <p class="lead fst-italic mb-0">
        Monitor maintenance and complaints in real time
      </p>
    </section>

    <!-- Filter and Actions -->
    <div class="container my-4">
      <div
        class="card shadow-sm p-3 mb-4 border-0"
        style="max-width: 700px; margin: auto"
      >
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
        >
          <select
            class="form-select text-center text-white bg-primary"
            style="max-width: 250px"
          >
            <option selected disabled>Select view</option>
            <option>Maintenance Requests</option>
            <option>Complaints</option>
          </select>

          <button class="btn btn-outline-primary" onclick="location.reload()">
            🔄 Refresh
          </button>
        </div>
      </div>

      <!-- Table Section -->
      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-borderless mb-0">
            <tbody id="requestsTableBody">
              <!-- populated by a function-->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Modal (Bootstrap) -->
    <div
      class="modal fade"
      id="viewRequestModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">
          <!-- Header -->
          <div class="modal-header bg-primary text-white rounded-top">
            <h6 class="modal-title fw-semibold">Request Details</h6>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <!-- Body -->
          <div class="modal-body">
            <div class="mb-3">
              <small class="text-muted">Request ID</small>
              <div class="fw-semibold" id="modalRequestId"></div>
            </div>
            <div class="mb-3">
              <small class="text-muted">Room</small>
              <div class="fw-semibold" id="modalRoom"></div>
            </div>

            <div class="mb-3">
              <small class="text-muted">Category</small>
              <div id="modalCategory"></div>
            </div>

            <div class="mb-3">
              <small class="text-muted">Description</small>
              <div class="bg-light rounded-2 p-2" id="modalDescription"></div>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <div>
                <small class="text-muted">Urgency</small><br />
                <span id="modalUrgency" class="badge"></span>
              </div>

              <div>
                <small class="text-muted">Status</small><br />
                <span id="modalStatus" class="badge"></span>
              </div>
            </div>

            <div>
              <small class="text-muted">Date Submitted</small>
              <div id="modalDate"></div>
            </div>
          </div>

          <!-- Footer -->
          <div class="modal-footer d-flex justify-content-between">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Close
            </button>

            <!-- Optional, simple status action -->
            <button class="btn btn-success btn-sm rounded-pill px-3">
              Mark as Done
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 bg-primary text-white fixed-bottom">
      &#169;
      <img
        src="/frontend/assets/logo-white.png"
        alt="Logo"
        width="100"
        height="27"
        class="d-inline-block align-text-top"
      />
    </footer>

    <!-- Bootstrap Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- Your custom JavaScript -->
    <script src="/frontend/scripts/main.js"></script>
  </body>
</html>
