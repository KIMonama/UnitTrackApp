<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Dashboard | UnitTrack</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-white" onload="populateTable()">
    <!-- Navbar -->
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center py-4 border-bottom border-primary">
      <h1>Welcome, Owner 👋</h1>
      <p class="lead fst-italic mb-0">
        Monitor maintenance and complaints in real time
      </p>
    </section>

    <!-- Filter and Actions -->
    <div class="container my-4">
      <div
        class="card shadow-sm p-3 mb-4 border-0"
        style="max-width: 700px; margin: auto"
      >
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
        >
          <select
            class="form-select text-center text-white bg-primary"
            style="max-width: 250px"
          >
            <option selected disabled>Select view</option>
            <option>Maintenance Requests</option>
            <option>Complaints</option>
          </select>

          <button class="btn btn-outline-primary" onclick="populateTable()">🔄 Refresh</button>
        </div>
      </div>

      <!-- Table Section -->
      <div class="table-responsive card p-2 shadow-sm border-0">
        <table class="table table-bordered align-middle text-center">
          <thead class="bg-primary text-white">
            <tr>
              <th scope="col">Request ID <br />& room</th>

              <th scope="col">Category <br />& Urgency</th>

              <th scope="col">Status</th>
              <th scope="col">Date</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="requestsTableBody">
            <!-- populated by a function-->
          </tbody>
        </table>
      </div>
    </div>
    <!-- Modal (Bootstrap) -->
    <div
      class="modal fade"
      id="viewRequestModal"
      tabindex="-1"
      aria-labelledby="viewRequestModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-primary">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="viewRequestModalLabel">
              Request Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-start">
            <p><strong>ID:</strong> <span id="modalRequestId"></span></p>
            <p><strong>Room:</strong> <span id="modalRoom"></span></p>
            <p><strong>Category:</strong> <span id="modalCategory"></span></p>
            <p>
              <strong>Description:</strong> <span id="modalDescription"></span>
            </p>
            <p><strong>Urgency:</strong> <span id="modalUrgency"></span></p>
            <p><strong>Status:</strong> <span id="modalStatus"></span></p>
            <p><strong>Date:</strong> <span id="modalDate"></span></p>
            <p><strong>SET STATUS:</strong> <span id="setStatus"></span></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <div class="dropdown">
              <button
                class="btn btn-secondary dropdown-toggle"
                type="button"
                id="dropdownMenuButton1"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown button
              </button>
              <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li>
                  <a class="dropdown-item" href="#">Something else here</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="text-center py-3 bg-primary text-white fixed-bottom">
      &#169;
      <img
        src="/frontend/assets/logo-white.png"
        alt="Logo"
        width="100"
        height="27"
        class="d-inline-block align-text-top"
      />
    </footer>

    <!-- Bootstrap Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- Your custom JavaScript -->
    <script src="/frontend/scripts/main.js"></script>
  </body>
</html>
