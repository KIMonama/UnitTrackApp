<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get started</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-white">
    <!-- Navbar -->
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center py-4 border-bottom border-primary">
      <h1>Welcome to UnitTrack</h1>
      <p class="lead fst-italic mb-0">
        Monitor maintenance and complaints in real time
      </p>
    </section>
    <!-- Get Started Form -->
    <div class="container my-1">
      <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 600px">
        <div class="text-center mb-4">
          <h4 class="text-primary fw-bold">Owner Information</h4>
        </div>

        <!-- Full Name -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input
            id="name"
            type="text"
            class="form-control"
            placeholder="e.g. Thabo Mokoena"
          />
          <div class="invalid-feedback">
            Please enter your full name (at least 3 characters).
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="e.g. owner@email.com"
          />
          <div class="invalid-feedback">
            Please enter a valid email address.
          </div>
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Phone Number</label>
          <input
            id="phone"
            type="text"
            class="form-control"
            placeholder="e.g. 081 234 5678"
          />
          <div class="invalid-feedback">
            Please enter a valid 10-digit SA phone number.
          </div>
        </div>

        <!-- Property Name (Optional) -->
        <div class="mb-4">
          <label class="form-label fw-semibold">
            Property Name <span class="text-muted">(optional)</span>
          </label>
          <input
            id="property"
            type="text"
            class="form-control"
            placeholder="e.g. Mokoena Rooms"
          />
        </div>
        <!-- Property Name (Optional) -->
        <div class="mb-4">
          <label class="form-label fw-semibold"> Number of Units </label>
          <input
            id="numberOfUnits"
            type="text"
            class="form-control"
            placeholder="e.g. 10"
          />
          <div class="invalid-feedback">
            Please enter a valid number (minimum 1).
          </div>
        </div>

        <!-- Button -->
        <div class="d-grid">
          <button
            id="submitBtn"
            class="btn btn-primary btn-lg shadow-sm"
          >
            Continue
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 bg-primary text-white fixed-bottom">
      &#169;
      <img
        src="/frontend/assets/logo-white.png"
        alt="Logo"
        width="100"
        height="27"
        class="d-inline-block align-text-top"
      />
    </footer>

    <!-- Bootstrap Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- Your custom JavaScript -->
    <script src="/frontend/scripts/ui/table.js"></script>
    <script type="module" src="/frontend/scripts/forms/submission.js"></script>
  </body>
</html>
