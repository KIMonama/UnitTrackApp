<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
    <title>Report</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center">
      <h1 class="text-warning" id="unitDetails"></h1>
      <h2>Submit a maintenance request or complaint below</h2>
      <p class="lead fst-italic mb-0">Maintenance requests made simple</p>
    </section>

    <!-- Main Content -->
    <div class="container mt-3 mb-5">
      <div class="card p-4 mx-auto" style="max-width: 400px">
        <!-- Role Tabs -->
        <ul class="nav nav-pills nav-fill mb-4" id="loginTabs">
          <li class="nav-item">
            <button
              class="nav-link active"
              data-role="maintenance"
              type="button"
            >
              Maintenance
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-role="complaints" type="button">
              Complaints / Suggestions
            </button>
          </li>
        </ul>

        <!-- Report Form -->
        <form id="reportForm" novalidate>
          <!-- Maintenance Fields -->
          <div id="maintenanceFields">
            <div class="mb-3 text-center">
              <select
                class="form-select text-center text-white bg-primary"
                id="category"
                onchange="showDescriptionSuggestions(this.value)"
              >
                <option selected disabled>Issue category</option>
                <option>Plumbing</option>
                <option>Electrical</option>
                <option>Doors</option>
                <option>Cleaning</option>
                <option>Noise</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="description"
                placeholder="Describe the issue"
              />
              <label for="description">Describe the issue</label>
            </div>

            <!-- Description Suggestions -->
            <div
              id="descriptionSuggestions"
              class="mb-3 d-flex flex-wrap gap-2"
            ></div>

            <div class="input-group mb-3">
              <label class="input-group-text" for="inputGroupFile01"
                >Upload</label
              >
              <input type="file" class="form-control" id="inputGroupFile01" />
            </div>

            <select class="form-select mb-3" id="urgency">
              <option value="" disabled selected>
                How urgent is this issue?
              </option>
              <option value="low">🟢 Low - Minor issue</option>
              <option value="medium">🟡 Medium - 1–2 days</option>
              <option value="high">🔴 High - Today</option>
              <option value="emergency">🚨 Emergency</option>
            </select>

            <div class="form-floating mb-3">
              <input type="date" class="form-control" id="availableDate" />
              <label for="availableDate">Date available</label>
            </div>
          </div>

          <!-- Complaints Fields -->
          <div id="complaintsFields" class="d-none">
            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="complaintsDescription"
                placeholder="Describe the issue"
              />
              <label for="complaintsDescription">Describe the issue</label>
            </div>
          </div>

          <!-- Submit -->
          <div class="mt-3">
            <button id="submitBtn1" class="btn btn-primary w-100">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Error Alert -->
    <div
      class="alert alert-danger d-flex align-items-center d-none mx-auto"
      role="alert"
      id="alert"
      style="max-width: 400px"
    >
      <div id="errorMessage"></div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <!-- Custom Scripts -->
    <script type="module" src="/frontend/scripts/main.js"></script>
    <script type="module" src="/frontend/scripts/UI/report.ui.js"></script>
    <script src="/frontend/scripts/UI/suggestions.js"></script>

    <!-- Footer -->
    <footer class="text-center py-3 bg-primary text-white fixed-bottom">
      &#169;
      <img
        src="/frontend/assets/logo-white.png"
        alt="Logo"
        width="100"
        height="27"
        class="d-inline-block align-text-top"
      />
    </footer>
  </body>
</html>
