<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
    <title>Report</title>
  </head>
  <body>
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>
    <!-- Hero Section -->
    <section class="hero text-center">
      <h1>Submit a maintenance request or complaint below</h1>
      <p class="lead fst-italic mb-0">Track every fix, right from your unit</p>
    </section>

    <div id="mOrC1" class="border-pulse mt-3 text-center w-50 mx-auto">
      <select class="form-select text-center text-white bg-primary" id="mOrC">
        <option selected disabled>Maintenance or complaint</option>
        <option>Maintenance request</option>
        <option>Complaint</option>
      </select>
    </div>
    <!-- Main Content -->
    <div class="container mt-3 mb-5">
      <div class="card p-4 mx-auto" style="max-width: 400px">
        <div class="mb-3 text-center">
          <select class="form-select text-center text-white bg-primary">
            <option selected disabled>Issue category</option>
            <option>Plumbing</option>
            <option>Electrical</option>
            <option>Doors</option>
            <option>Cleaning</option>
            <option>Noise</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="code"
            placeholder="Enter code"
          />
          <label for="code">Add a description</label>
        </div>

        <div class="input-group mb-3">
          <label class="input-group-text" for="inputGroupFile01">Upload</label>
          <input type="file" class="form-control" id="inputGroupFile01" />
        </div>
        <select class="form-select" name="urgency" required>
          <option value="" disabled selected>How urgent is this issue?</option>
          <option value="low">🟢 Low - Minor issue, no time sensitivity</option>
          <option value="medium">
            🟡 Medium - Needs attention in 1-2 days
          </option>
          <option value="high">
            🔴 High - Serious issue, needs attention today
          </option>
          <option value="emergency">
            🚨 Emergency - Immediate danger or major damage
          </option>
        </select>
        <div class="form-floating mb-3 mt-3">
          <input
            type="date"
            class="form-control"
            id="availableDate"
            name="availableDate"
            required
          />
          <label for="availableDate">Date available for maintenance</label>
        </div>
      </div>
      <div class="mt-3 mx-auto">
        <a
          ><button onclick="inputValidate()" class="btn btn-primary w-50 mx-auto d-block">Submit</button></a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

     <!-- Your custom JavaScript -->
    <script src="/frontend/scripts/main.js"></script>
  </body>
  <!-- Footer -->
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom mt-3"
  >
    &#169;
    <img
      src="/frontend/assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
