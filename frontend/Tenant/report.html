<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report Issue | UnitTrack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-light pb-5">
    <nav class="navbar bg-white border-bottom sticky-top py-3">
      <div class="container-fluid px-3">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-blue.png"
            alt="Logo"
            width="100"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-primary fw-bold small text-decoration-none"
          >Contact us</a
        >
      </div>
    </nav>

    <section
      class="hero-report py-5 px-3 text-center bg-primary text-white mb-n4 pb-5"
    >
      <div
        class="d-flex align-items-center justify-content-center gap-1 mb-2 opacity-75"
      >
        <i class="bi bi-tools small"></i>
        <span class="small text-uppercase tracking-wider fw-bold"
          >Maintenance Portal</span
        >
      </div>

      <h1 class="display-6 fw-black text-white mb-1" id="unitDetails">
        Checking Unit...
      </h1>

      <div
        class="d-inline-block px-3 py-1 rounded-pill bg-white bg-opacity-10 mt-2"
      >
        <p
          class="x-small mb-0 fw-bold text-uppercase tracking-wider text-warning"
        >
          <i class="bi bi-shield-check me-1"></i> Maintenance made simple
        </p>
      </div>
    </section>

    <div class="container px-3 position-relative" style="margin-top: -20px">
      <div class="bg-white rounded-4 shadow-sm p-4 border-0 mb-5">
        <ul class="nav nav-pills nav-fill modern-tabs mb-4" id="loginTabs">
          <li class="nav-item">
            <button
              class="nav-link active"
              data-role="maintenance"
              type="button"
            >
              Maintenance
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-role="complaints" type="button">
              Complaints
            </button>
          </li>
        </ul>

        <form id="reportForm" novalidate>
          <div id="maintenanceFields">
            <div class="mb-4">
              <label
                class="form-label x-small fw-bold text-uppercase opacity-50"
                >What is the problem?</label
              >
              <select
                class="form-select form-select-lg category-select"
                id="category"
                onchange="showDescriptionSuggestions(this.value)"
              >
                <option selected disabled>Select Category</option>
                <option>Plumbing</option>
                <option>Electrical</option>
                <option>Doors</option>
                <option>Cleaning</option>
                <option>Noise</option>
                <option>Other</option>
              </select>
            </div>

            <div
              id="descriptionSuggestions"
              class="mb-3 d-flex flex-wrap gap-2"
            ></div>

            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="description"
                placeholder="Describe the issue"
              />
              <label for="description">Specific details...</label>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-12">
                <label
                  class="form-label x-small fw-bold text-uppercase opacity-50"
                  >Photo Proof (Optional)</label
                >
                <input
                  type="file"
                  class="form-control bg-light border-0"
                  id="inputGroupFile01"
                />
              </div>
              <div class="col-12 mt-3">
                <label
                  class="form-label x-small fw-bold text-uppercase opacity-50"
                  >Urgency Level</label
                >
                <select class="form-select border-light bg-light" id="urgency">
                  <option value="" disabled selected>
                    How urgent is this?
                  </option>
                  <option value="low">🟢 Low - Minor issue</option>
                  <option value="medium">🟡 Medium - 1–2 days</option>
                  <option value="high">🔴 High - Today</option>
                  <option value="emergency">🚨 Emergency</option>
                </select>
              </div>
            </div>

            <div class="form-floating mb-4">
              <input type="date" class="form-control" id="availableDate" />
              <label for="availableDate">When are you home for access?</label>
            </div>
          </div>

          <div id="complaintsFields" class="d-none">
            <div class="form-floating mb-4">
              <textarea
                class="form-control"
                id="complaintsDescription"
                placeholder="Describe the issue"
                style="height: 150px"
              ></textarea>
              <label for="complaintsDescription"
                >Your feedback or complaint...</label
              >
            </div>
          </div>

          <button
            id="submitBtn1"
            class="btn btn-primary btn-lg w-100 fw-bold shadow-sm rounded-pill"
          >
            Submit Report
          </button>
        </form>
      </div>
    </div>

    <div
      class="alert alert-danger d-flex align-items-center d-none mx-3 fixed-bottom mb-5"
      role="alert"
      id="alert"
    >
      <i class="bi bi-exclamation-octagon-fill me-2"></i>
      <div id="errorMessage"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/scripts/main.js"></script>
    <script type="module" src="/frontend/scripts/UI/report.ui.js"></script>
    <script src="/frontend/scripts/UI/suggestions.js"></script>
    <footer class="text-center py-4 mt-auto text-muted small">
      &#169; 2026 UnitTrack
    </footer>
  </body>
</html>
