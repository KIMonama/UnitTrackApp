<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Custom CSS -->
    <link href="/frontend/styles/style.css" rel="stylesheet" />
    <title>Report</title>
  </head>
  <body class="bg-white">
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>
    <!-- Hero Section -->
    <section class="hero text-center">
      <h1>Submision complete!!</h1>
      <p class="lead fst-italic mb-0">Track every fix, right from your unit</p>
    </section>

    <!-- Main Content -->
    <div
      class="container d-flex flex-column align-items-center justify-content-center my-4"
    >
      <div
        class="card shadow-lg border-0 rounded-4 p-4 text-center"
        style="max-width: 400px; width: 100%"
      >
        <div class="mb-3">
          <img
            src="/frontend/assets/green-check.png"
            class="img-fluid"
            alt="Success"
            style="max-width: 100px"
          />
        </div>
        <h2 class="fw-semibold text-success mb-2">
          Report Submitted Successfully
        </h2>
        <p class="text-muted mb-4">
          Thank you for your submission! Our maintenance team will review your
          report shortly.
        </p>
        <a
          href="report.html"
          class="btn btn-primary w-100 py-2 fw-semibold rounded-pill"
        >
          New report
        </a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
  <!-- Footer -->
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom mt-3"
  >
    &#169;
    <img
      src="/frontend/assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
