<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submission Complete | UnitTrack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-light pb-5">
    <nav class="navbar bg-white border-bottom py-3">
      <div class="container-fluid px-3">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-blue.png"
            alt="Logo"
            width="100"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-primary fw-bold small text-decoration-none"
          >Contact us</a
        >
      </div>
    </nav>

    <div class="container px-3 p-5">
      <div
        class="card success-card shadow-sm border-0 mx-auto text-center p-4 p-md-5"
      >
        <div class="success-icon-container mb-4">
          <div class="success-pulse"></div>
          <i class="bi bi-check-circle-fill text-primary display-1"></i>
        </div>

        <h2 class="fw-bold text-dark mb-2">Report Submitted</h2>
        <p class="text-muted mb-4 small">
          Thank you for your submission! Our maintenance team will review your
          report shortly.
        </p>

        <a
          href="report.html"
          class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-pill shadow-sm"
        >
          Submit New Report
        </a>

        <a
          href="/frontend/index.html"
          class="btn btn-link text-muted mt-3 text-decoration-none small"
        >
          Back to Home
        </a>
      </div>
    </div>

    <footer class="text-center py-4 mt-5 text-muted small">
      &#169; 2026 UnitTrack
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
