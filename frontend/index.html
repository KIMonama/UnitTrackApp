<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <title>Welcome</title>
  </head>
  <body class="bg-white">
    <div class="container">
      <!-- Content here -->
      <nav class="navbar bg-primary py-3">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="assets/logo-white.png"
              alt="Logo"
              width="100"
              height="27"
              class="d-inline-block align-text-top"
            />
          </a>
          <a class="text-white">Contact us</a>
        </div>
      </nav>
      <div class="main-headers mt-3">
        <h1 class="text-primary text-center">Welcome to UnitTrack</h1>
        <h1 class="text-primary text-center fst-italic">
          Track every fix, right from your unit
        </h1>
      </div>
      <div
        class="form border-top pt-3 border-primary border-2 text-center mt-5"
      >
        <input
          type="radio"
          class="btn-check"
          name="options-outlined"
          id="success-outlined"
          autocomplete="off"
          checked
        />
        <label class="btn btn-outline-primary" for="success-outlined"
          >Tenant</label
        >

        <input
          type="radio"
          class="btn-check"
          name="options-outlined"
          id="danger-outlined"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="danger-outlined"
          >Landlord</label
        >
        <form class="row g-3 mt-3 text-primary">
          <div class="col-auto">
            <label for="staticEmail2" class="visually-hidden">Email</label>
            <input
              type="text"
              readonly
              class="form-control-plaintext"
              id="staticEmail2"
              value="Enter the following info"
            />
          </div>
          <div class="col-auto">
            <label for="inputPassword2" class="visually-hidden">Password</label>
            <input
              type="password"
              class="form-control"
              id="inputPassword2"
              placeholder="Room code or cellphone"
            />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary mb-3">
              Confirm identity
            </button>
          </div>
        </form>
      </div>
      <h1 class="text-center text-primary">or</h1>
      <div class="d-flex justify-content-center">
        <button class="btn btn-primary">Get started</button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom"
  >
    &#169;
    <img
      src="assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
