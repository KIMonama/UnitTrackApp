<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Custom CSS -->
    <link href="styles/style.css" rel="stylesheet" />
    <title>Welcome</title>
  </head>

  <body id="Body">
    <!-- Nav bar -->
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center">
      <h1>Welcome to UnitTrack</h1>
      <p class="lead fst-italic mb-0">Maintenance requests made simple</p>
    </section>

    <!-- Main Content -->
    <div class="container d-flex justify-content-center mt-4">
      <div
        class="card shadow-sm rounded-4 p-4"
        style="max-width: 420px; width: 100%"
      >
        <h3 class="text-center mb-1">UnitTrack</h3>
        <p class="text-center text-muted mb-4">Enter log in details</p>

        <!-- Role Tabs -->
        <ul class="nav nav-pills nav-fill mb-4" id="loginTabs">
          <li class="nav-item">
            <button class="nav-link active" data-role="tenant" type="button">
              Tenant
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-role="admin" type="button">
              Admin
            </button>
          </li>
        </ul>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <!-- Tenant -->
          <div id="tenantFields">
            <div class="mb-3">
              <label id="codeLabel">Unit Code</label>
              <input
                type="text"
                id="unitCode"
                class="form-control rounded-3"
                placeholder="e.g. A12"
              />
            </div>
          </div>

          <!-- Admin -->
          <div id="adminFields" class="d-none">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                id="email"
                class="form-control rounded-3"
                placeholder="admin@email.com"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">PIN</label>
              <input
                type="password"
                id="pin"
                class="form-control rounded-3"
                placeholder="••••"
              />
            </div>
          </div>

          <button
            type="button"
            id="loginBtn"
            class="btn btn-primary w-100 rounded-3"
          >
            Login
          </button>
        </form>
      </div>
    </div>
    <div class="mx-5 my-4">
      <a href="Owner/getStarted.html">
        <button class="btn btn-outline-primary w-100">
          <span class="spinner-border spinner-border-sm me-1"></span>
          Get started
        </button>
      </a>
    </div>
    <!-- Hidden alert  -->
    <div
      class="alert alert-danger d-flex align-items-center d-none mx-auto"
      role="alert"
      id="alert"
      style="max-width: 400px"
    >
      <svg
        class="bi flex-shrink-0 me-2"
        width="24"
        height="24"
        role="img"
        aria-label="Danger:"
      >
        <use xlink:href="#exclamation-triangle-fill" />
      </svg>
      <div id="errorMessage"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- Your custom JavaScript -->
    <script type="module" src="/frontend/scripts/UI/login.ui.js"></script>
    <script type="module" src="/frontend/scripts/main.js"></script>
  </body>
  <!-- Footer -->
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom"
  >
    &#169;
    <img
      src="assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
