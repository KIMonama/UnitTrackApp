<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome | UnitTrack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link href="styles/style.css" rel="stylesheet" />
  </head>

  <body id="Body" class="bg-light">
    <nav class="navbar bg-white border-bottom py-3">
      <div class="container-fluid px-3">
        <a class="navbar-brand" href="#">
          <img
            src="assets/logo-blue.png"
            alt="Logo"
            width="100"
            class="d-inline-block align-text-top"
          />
        </a>
        <a
          href="mailto:support@unitrack.co.za"
          class="text-primary text-decoration-none fw-bold small"
          >Contact us</a
        >
      </div>
    </nav>

    <section
      class="hero-login py-5 px-3 text-center bg-primary text-white mb-n4 pb-5"
    >
      <div
        class="d-flex align-items-center justify-content-center gap-1 mb-2 opacity-75"
      >
        <i class="bi bi-shield-lock small"></i>
        <span class="small text-uppercase tracking-wider fw-bold"
          >Secure Access</span
        >
      </div>
      <h1 class="display-6 fw-black text-white mb-1">Welcome to UnitTrack</h1>
      <div
        class="d-inline-block px-3 py-1 rounded-pill bg-white bg-opacity-10 mt-2"
      >
        <p
          class="x-small mb-0 fw-bold text-uppercase tracking-wider text-warning"
        >
          <i class="bi bi-shield-check me-1"></i> Maintenance made simple
        </p>
      </div>
    </section>

    <div class="container px-3 position-relative" style="margin-top: -20px">
      <div
        class="card login-card shadow-sm border-0 mx-auto rounded-4 overflow-hidden"
        style="max-width: 400px"
      >
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-1 text-dark">Portal Login</h3>
          <p class="text-center text-muted mb-4 small">
            Select your role to continue
          </p>

          <ul class="nav nav-pills nav-fill modern-tabs mb-4" id="loginTabs">
            <li class="nav-item">
              <button class="nav-link active" data-role="tenant" type="button">
                Tenant
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-role="admin" type="button">
                Admin
              </button>
            </li>
          </ul>

          <form id="loginForm" novalidate>
            <div id="tenantFields">
              <div class="mb-3">
                <label
                  id="codeLabel"
                  class="form-label x-small fw-bold text-uppercase opacity-50"
                  >Unit Code</label
                >
                <input
                  type="text"
                  id="unitCode"
                  class="form-control form-control-lg bg-light border-0"
                  placeholder="e.g. A12"
                />
              </div>
            </div>

            <div id="adminFields" class="d-none">
              <div class="mb-3">
                <label
                  class="form-label x-small fw-bold text-uppercase opacity-50"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  class="form-control form-control-lg bg-light border-0"
                  placeholder="admin@email.com"
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label x-small fw-bold text-uppercase opacity-50"
                  >PIN</label
                >
                <input
                  type="password"
                  id="pin"
                  class="form-control form-control-lg bg-light border-0"
                  placeholder="••••"
                />
              </div>
            </div>

            <button
              type="button"
              id="loginBtn"
              class="btn btn-primary btn-lg w-100 fw-bold mt-2 shadow-sm rounded-pill"
            >
              Login
            </button>
          </form>

          <hr class="my-4 text-muted opacity-25" />

          <div class="text-center">
            <p class="small text-muted mb-3">Property owner?</p>
            <a
              href="/public/get-started.html"
              class="text-decoration-none d-block"
            >
              <button
                class="btn btn-outline-primary w-100 rounded-pill py-2 fw-bold"
              >
                Get started
              </button>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div
      class="alert alert-danger d-flex align-items-center d-none mt-3 mx-3"
      role="alert"
      id="alert"
    >
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <div id="errorMessage" class="small"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/scripts/UI/login.ui.js"></script>
    <script type="module" src="/frontend/scripts/main.js"></script>

    <footer class="text-center py-4 mt-auto text-muted small">
      &#169; 2026 UnitTrack
    </footer>
  </body>
</html>
