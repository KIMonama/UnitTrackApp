<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <title>Welcome</title>
  </head>
  <body class="bg-white">
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>
    <div class="container">
      <!-- Content here -->

      <div class="main-headers mt-3 border-bottom border-primary pb-5">
        <h1 class="text-primary text-center">Welcome to UnitTrack</h1>
        <h1 class="text-primary text-center fst-italic">
          Track every fix, right from your unit
        </h1>
      </div>

      <div class="mt-3">
        <select class="form-select btn btn-primary text-center w-26">
          <option selected disabled>Select option</option>
          <option>TENANT</option>
          <option>OWNER</option>
        </select>
      </div>
      <div class="form-floating mb-3 mt-3 text-primary">
        <input
          type="text"
          class="form-control"
          id="code"
          placeholder="Enter code"
          name="code"
        />
        <label for="code">Enter room code or cellphone</label>
      </div>
      <div class="d-flex justify-content-center mb-5">
        <button class="btn btn-primary">Log in</button>
      </div>

      <div class="d-flex justify-content-center">
        <button class="btn btn-primary">
          <span class="spinner-border spinner-border-sm"></span>
          Get started
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom"
  >
    &#169;
    <img
      src="assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
