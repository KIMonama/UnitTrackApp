<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Custom CSS -->
    <link href="styles/style.css" rel="stylesheet" />
    <title>Welcome</title>
  </head>

  <body>
    <nav class="navbar bg-primary py-3 mx-0 px-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="assets/logo-white.png"
            alt="Logo"
            width="100"
            height="27"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-white">Contact us</a>
      </div>
    </nav>
    <!-- Hero Section -->
    <section class="hero text-center">
      <h1>Welcome to UnitTrack</h1>
      <p class="lead fst-italic mb-0">Track every fix, right from your unit</p>
    </section>

    <!-- Main Content -->
    <div class="container mt-5 mb-5">
      <div class="card p-4 mx-auto" style="max-width: 400px">
        <div class="mb-3 text-center">
          <select class="form-select text-center text-white bg-primary">
            <option selected disabled>Select option</option>
            <option>TENANT</option>
            <option>OWNER</option>
          </select>
        </div>

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="code"
            placeholder="Enter code"
          />
          <label for="code">Enter room code or cellphone</label>
        </div>

        <div class="d-grid gap-2">
          <a href="Tenant/report.html"
            ><button class="btn btn-primary btn-lg w-100">Log in</button></a
          >
          <button class="btn btn-outline-primary">
            <span class="spinner-border spinner-border-sm me-1"></span>
            Get started
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
  <!-- Footer -->
  <footer
    class="text-center text-center py-3 bg-primary text-white fixed-bottom"
  >
    &#169;
    <img
      src="assets/logo-white.png"
      alt="Logo"
      width="100"
      height="27"
      class="d-inline-block align-text-top"
    />
  </footer>
</html>
