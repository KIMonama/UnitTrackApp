<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Dashboard | UnitTrack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="/frontend/styles/style.css" rel="stylesheet" />
  </head>

  <body class="bg-light pb-5">
    <nav class="navbar bg-white border-bottom sticky-top py-3">
      <div class="container-fluid px-3">
        <a class="navbar-brand" href="/frontend/index.html">
          <img
            src="/frontend/assets/logo-blue.png"
            alt="Logo"
            width="100"
            class="d-inline-block align-text-top"
          />
        </a>
        <a class="text-primary fw-bold small text-decoration-none"
          >Contact us</a
        >
      </div>
    </nav>

    <section
      class="hero-report py-5 px-3 text-center bg-primary text-white mb-n4 pb-5"
    >
      <div
        class="d-flex align-items-center justify-content-center gap-1 mb-2 opacity-75"
      >
        <span class="small">Welcome back,</span>
        <span class="fw-bold small" id="welcomeName">User</span>
      </div>

      <h1 class="display-6 fw-black text-white mb-1" id="propertyName">
        Loading Property...
      </h1>

      <div
        class="d-inline-block px-3 py-1 rounded-pill bg-white bg-opacity-10 mt-2"
      >
        <p
          class="x-small mb-0 fw-bold text-uppercase tracking-wider text-warning"
        >
          <i class="bi bi-shield-check me-1"></i> Maintenance made simple
        </p>
      </div>
    </section>

    <div
      class="container px-3 position-relative"
      style="margin-top: -20px"
    ></div>
    <div class="container px-3 mb-4">
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="p-2 bg-white">
          <div class="d-flex align-items-center gap-2">
            <ul
              class="nav nav-pills nav-fill modern-tabs flex-grow-1"
              id="loginTabs"
            >
              <li class="nav-item">
                <button
                  class="nav-link active"
                  data-role="maintenance"
                  type="button"
                >
                  Maintenance
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-role="suggestions" type="button">
                  Suggestions
                </button>
              </li>
            </ul>

            <button
              id="refreshBtn"
              class="btn btn-primary rounded-3 px-3 shadow-sm"
            >
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container px-3">
      <div id="requestsTableContainer">
        <table class="table table-hover custom-mobile-table align-middle">
          <tbody id="requestsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div
      class="modal fade"
      id="viewRequestModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-dialog-centered mx-auto"
        style="max-width: 90%; width: 380px"
      >
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="modalRoom">Room Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body pt-2">
            <div class="row g-3 mb-4">
              <div class="col-6">
                <small class="text-uppercase text-muted fw-bold x-small"
                  >Request ID</small
                >
                <div class="fw-bold text-primary" id="modalRequestId"></div>
              </div>
              <div class="col-6 text-end">
                <small class="text-uppercase text-muted fw-bold x-small"
                  >Date</small
                >
                <div id="modalDate" class="small"></div>
              </div>
            </div>

            <div class="mb-4">
              <label
                class="badge bg-primary-subtle text-primary mb-2"
                id="modalCategory"
                >Category</label
              >
              <div
                class="p-3 bg-light rounded-3 border-0 small"
                id="modalDescription"
              ></div>
            </div>

            <div class="row g-2 mb-4">
              <div class="col-6">
                <div class="p-2 border rounded-3 text-center">
                  <small class="d-block text-muted x-small">URGENCY</small>
                  <span id="modalUrgency" class="badge"></span>
                </div>
              </div>
              <div class="col-6">
                <div class="p-2 border rounded-3 text-center">
                  <small class="d-block text-muted x-small">STATUS</small>
                  <span id="modalStatus" class="badge"></span>
                </div>
              </div>
            </div>

            <div class="p-3 bg-blue-light rounded-3 mb-2">
              <small class="text-muted d-block small"
                >Owner Access Available:</small
              >
              <div id="availableDate" class="fw-bold"></div>
            </div>
          </div>

          <div class="modal-footer border-0 flex-column gap-2 pb-4">
            <div class="d-flex w-100 gap-2">
              <button
                id="shareButton"
                type="button"
                class="btn btn-outline-primary rounded-pill flex-fill py-2"
              >
                <i class="bi bi-share me-1"></i> Share
              </button>
              <button
                id="doneButton"
                type="button"
                class="btn btn-success rounded-pill flex-fill py-2 fw-bold"
              >
                <i id="buttonIcon" class="bi bi-check-circle me-1"></i>
                <span id="buttonText">Mark Done</span>
              </button>
            </div>
            <button
              type="button"
              class="btn btn-link text-muted text-decoration-none small"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center py-4 mt-5 text-muted small">
      <div class="fw-black fs-5 text-primary mb-1">
        UNIT<span class="text-dark">TRACK</span>
      </div>
      &#169; 2026 UnitTrack
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/scripts/main.js"></script>
  </body>
</html>
