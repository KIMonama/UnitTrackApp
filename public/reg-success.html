<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Created | UnitTrack</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link href="/public/styles/style.css" rel="stylesheet" />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="container px-4 text-center">
      <div
        class="card success-card border-0 shadow-lg mx-auto p-5"
        style="max-width: 500px"
      >
        <div class="mb-4">
          <div class="success-icon-container">
            <div class="success-pulse"></div>
            <i class="bi bi-rocket-takeoff-fill text-primary display-2"></i>
          </div>
        </div>

        <h2 class="fw-bold text-dark mb-2">Welcome to the Future!</h2>
        <p class="text-muted mb-4">
          Your UnitTrack account is ready. You can now start automating your
          maintenance and protecting your profits.
        </p>

        <div class="d-grid gap-2">
          <a
            href="/frontend/index.html"
            class="btn btn-primary btn-lg fw-bold rounded-pill py-3"
          >
            Go to Login
          </a>
        </div>
      </div>

      <p class="mt-4 text-muted small">
        Need help getting started?
        <a
          href="/public/contact.html"
          class="text-primary fw-bold text-decoration-none"
          >Contact Support</a
        >
      </p>
    </div>
  </body>
</html>
