<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Get Started | UnitTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="/public/styles/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-light py-4">
      <div class="container justify-content-center">
        <a href="index.html" class="navbar-brand text-primary fw-bold fs-3"
          >UNIT<span class="text-dark">TRACK</span></a
        >
      </div>
    </nav>

    <div
      class="container py-4 d-flex align-items-center justify-content-center"
    >
      <div
        id="step1"
        class="signup-card p-4 p-md-5 w-100 active"
        style="max-width: 550px"
      >
        <div class="text-center mb-4">
          <span class="step-indicator">Step 1 of 2</span>
          <h2 class="fw-bold mt-2">Create Your Account</h2>
          <p class="text-muted">Tell us about you and your property.</p>
        </div>
        <form id="formStep1">
          <div class="row g-3">
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Name"
                  required
                /><label>Full Name</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Email"
                  required
                /><label>Email Address</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  placeholder="Phone"
                  required
                /><label>Phone Number</label>
              </div>
            </div>
            <div class="col-8">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="propName"
                  placeholder="Property"
                  required
                /><label>Property Name</label>
              </div>
            </div>
            <div class="col-4">
              <div class="form-floating">
                <input
                  type="number"
                  class="form-control"
                  id="units"
                  placeholder="Units"
                  required
                /><label>Units</label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">
              Continue <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>

      <div
        id="step2"
        class="signup-card p-4 p-md-5 w-100"
        style="max-width: 550px"
      >
        <div class="text-center mb-4">
          <span class="step-indicator">Step 2 of 2</span>
          <h2 class="fw-bold mt-2">Set Your Password</h2>
          <p class="text-muted">Secure your access to the Owner Dashboard.</p>
        </div>
        <form id="formStep2">
          <div class="row g-3">
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="password"
                  class="form-control"
                  id="pass"
                  placeholder="Pass"
                  required
                /><label>Password</label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-floating">
                <input
                  type="password"
                  class="form-control"
                  id="confirmPass"
                  placeholder="Confirm"
                  required
                /><label>Confirm Password</label>
              </div>
            </div>
            <div class="form-check mt-3 mx-2">
              <input
                class="form-check-input"
                type="checkbox"
                id="terms"
                required
              />
              <label class="form-check-label small text-muted"
                >I agree to the terms and conditions.</label
              >
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">
              Finish Registration <i class="bi bi-check-circle"></i>
            </button>
            <button
              type="button"
              onclick="showStep(1)"
              class="btn btn-link btn-sm text-muted mt-2 text-decoration-none"
            >
              Back to Step 1
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/public/scripts/main.js"></script>
  </body>
</html>
